model: llama3.2:1b
db_path: artifacts/verification/ollama-final.sqlite
artifact_dir: artifacts/verification
objective:
  title: Live Ollama smoke investigation
  permitted_parameters:
    sample_size: [1000]
    train_prevalence: [0.5]
    evaluation_prevalence: [0.2]
    feature_count: [6]
    class_separation: [1.0]
    noise: [0.0]
    logistic_c: [1.0]
    probability_temperature: [1.0]
budget:
  max_experiments: 2
  max_rounds: 3
  max_candidates: 1
  max_tokens: 30000
  call_token_reserve: 1600
  wall_seconds: 600
  experiment_timeout: 20
exploratory_seeds: [0, 1, 2]
confirmatory_seeds: [10000, 10001, 10002]
