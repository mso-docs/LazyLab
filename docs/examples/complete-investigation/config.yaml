model: qwen3:0.6b
inference_thinking: false
inference_threads: 4
inference_timeout_seconds: 300
db_path: artifacts/verification/iteration/completion-correlated.sqlite
artifact_dir: artifacts/verification/iteration/completion-correlated
objective:
  title: Independent confirmation of a scoped prevalence-shift condition
  question: Characterize whether oracle correction consistently improves or worsens Brier score for this one authorized synthetic condition. Explore first, then perform a final batch with three distinct reserved confirmation seeds. Preserve uncertainty about generalization.
  permitted_parameters:
    sample_size: [500]
    train_prevalence: [0.5]
    evaluation_prevalence: [0.2]
    feature_count: [6]
    class_separation: [1.0]
    noise: [0.0]
    logistic_c: [1.0]
    probability_temperature: [1.0]
  success_criteria:
    minimum_replications: 3
    minimum_conditions: 1
    minimum_exploratory_experiments: 1
    require_confirmation: true
    minimum_confirmatory_groups: 1
    effect_direction: either
budget:
  max_experiments: 6
  max_rounds: 3
  max_candidates: 3
  max_tokens: 30000
  call_token_reserve: 2000
  wall_seconds: 600
  experiment_timeout: 20
exploratory_seeds: [0, 1, 2]
confirmatory_seeds: [10000, 10001, 10002]
