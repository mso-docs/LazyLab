[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slothlab"
version = "0.2.0"
description = "Local autonomous scientific research with compute-aware LazyLoop control"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "numpy>=2,<3", "pandas>=2,<4", "scikit-learn>=1.5,<2", "PyYAML>=6,<7", "psutil>=6,<8"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.66,<2"]
auth = ["streamlit[auth]>=1.66,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
slothlab = "slothlab.cli:main"

[tool.setuptools.packages.find]
include = ["slothlab*"]

[tool.setuptools.package-data]
slothlab = ["data/**/*.yaml", "data/**/*.json", "data/**/*.mp4", "data/**/*.vtt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: requires a running Ollama model"]
