objective:
  title: Risk of premature stopping
  question: Do not stop after repeated proposals or the minimum three confirmations
    while a fourth independent predeclared confirmation remains.
  permitted_parameters:
    sample_size:
    - 1000
    train_prevalence:
    - 0.5
    evaluation_prevalence:
    - 0.5
    feature_count:
    - 6
    class_separation:
    - 1.0
    noise:
    - 0.0
    logistic_c:
    - 1.0
    probability_temperature:
    - 1.0
  success_criteria:
    minimum_replications: 3
    minimum_exploratory_experiments: 1
    minimum_conditions: 1
    require_confirmation: true
    effect_direction: zero
    effect_tolerance: 1.0e-10
budget:
  max_experiments: 8
  max_rounds: 20
  wall_seconds: 120
  max_tokens: 20000
  no_progress_rounds: 3
