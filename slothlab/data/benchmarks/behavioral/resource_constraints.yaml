objective:
  title: Resource constraint enforcement
  question: Defer work whose estimated cost cannot fit the remaining hard budget,
    then permit a cheap authorized action.
  permitted_parameters:
    sample_size:
    - 1000
    train_prevalence:
    - 0.5
    evaluation_prevalence:
    - 0.2
    feature_count:
    - 6
    class_separation:
    - 1.0
    noise:
    - 0.0
    logistic_c:
    - 1.0
    probability_temperature:
    - 1.0
budget:
  max_experiments: 2
  max_rounds: 20
  wall_seconds: 30
  max_tokens: 20000
  no_progress_rounds: 3
  experiment_timeout: 20
