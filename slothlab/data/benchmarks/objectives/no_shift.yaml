objective:
  title: No-shift control
  question: Does prior correction change predictions when train and evaluation prevalence
    are equal?
  permitted_parameters:
    train_prevalence:
    - 0.5
    evaluation_prevalence:
    - 0.5
    sample_size:
    - 500
    feature_count:
    - 6
    class_separation:
    - 1.0
    noise:
    - 0.0
    logistic_c:
    - 1.0
    probability_temperature:
    - 1.0
budget:
  max_experiments: 12
  max_rounds: 20
  max_tokens: 20000
