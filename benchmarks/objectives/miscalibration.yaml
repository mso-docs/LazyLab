objective:
  title: Miscalibration sensitivity
  permitted_parameters:
    train_prevalence:
    - 0.5
    evaluation_prevalence:
    - 0.2
    sample_size:
    - 500
    feature_count:
    - 6
    class_separation:
    - 1.0
    noise:
    - 0.0
    logistic_c:
    - 1.0
    probability_temperature:
    - 0.25
    - 4.0
  question: How does deliberately altered classifier calibration change the benefit
    or harm of oracle correction?
budget:
  max_experiments: 12
  max_rounds: 20
  max_tokens: 20000
