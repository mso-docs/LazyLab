objective:
  title: Counterexamples and hypothesis revision
  permitted_parameters:
    train_prevalence:
    - 0.5
    evaluation_prevalence:
    - 0.2
    sample_size:
    - 1000
    feature_count:
    - 6
    class_separation:
    - 1.0
    noise:
    - 0.0
    logistic_c:
    - 1.0
    probability_temperature:
    - 1.0
  question: Can the investigation preserve contradictory evidence rather than claim
    correction always helps?
budget:
  max_experiments: 12
  max_rounds: 20
  max_tokens: 20000
